services:
  - type: web
    name: ginseng-farm-platform
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    # 무료 요금제 컨테이너는 15분 이상 요청이 없으면 재시작되고, 그때마다 로컬
    # 디스크(SQLite DB + 업로드 사진)가 전부 초기화되어 그동안 등록한 기록이
    # 사라졌다. 영구 디스크는 유료 요금제에서만 붙일 수 있어 plan을 올리고,
    # DB/업로드 경로를 이 디스크 위로 옮겨 재시작해도 데이터가 남도록 한다.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_USERNAME
        value: admin
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/ginseng_farm.db
      - key: UPLOAD_DIR
        value: /var/data/uploads

  - type: web
    name: ginseng-farm-dashboard
    runtime: static
    staticPublishPath: ./admin_dashboard

  - type: web
    name: ginseng-farm-webapp
    runtime: static
    staticPublishPath: ./webapp
