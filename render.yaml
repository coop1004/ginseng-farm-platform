services:
  - type: web
    name: ginseng-farm-platform
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

  - type: web
    name: ginseng-farm-dashboard
    runtime: static
    staticPublishPath: ./admin_dashboard
    plan: free
