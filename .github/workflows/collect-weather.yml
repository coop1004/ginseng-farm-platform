name: Collect daily weather

on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 6시에 실행 (UTC 21:00 전날)
    - cron: "0 21 * * *"
  workflow_dispatch: {} # 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Call weather collection endpoint
        run: |
          curl -sf -X POST "https://ginseng-farm-platform.onrender.com/api/admin/weather/collect" \
            -H "X-Cron-Secret: ${{ secrets.WEATHER_CRON_SECRET }}" \
            --max-time 120
